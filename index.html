<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Gold Sextant</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Poppins,sans-serif;
    background:
    radial-gradient(circle at top,#403000,#0c0c0c 30%,#050505 100%);
    height:100vh;
    color:white;
}

.stars{
    position:absolute;
    width:100%;
    height:100%;
    background-image:
    radial-gradient(white 1px, transparent 1px);
    background-size:55px 55px;
    opacity:.25;
    animation:stars 80s linear infinite;
}

@keyframes stars{
from{transform:translateY(0);}
to{transform:translateY(-600px);}
}

.glow{
    position:absolute;
    width:700px;
    height:700px;
    background:radial-gradient(#d7b54d55,transparent 70%);
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    filter:blur(30px);
}

.container{
    position:relative;
    z-index:10;
    display:flex;
    height:100vh;
    align-items:center;
    justify-content:space-around;
    padding:60px;
}

.left{
    width:45%;
}

.logo{

    font-family:Cinzel,serif;
    font-size:65px;
    line-height:70px;
    color:#f6d365;
    text-shadow:
    0 0 15px #c7a135,
    0 0 35px #9b7a20;
}

.subtitle{

    margin-top:20px;
    color:#d8d8d8;
    font-size:20px;
    letter-spacing:2px;
}

.line{

    margin:30px 0;
    width:120px;
    height:3px;
    background:#d8b44a;
}

.menu{

    display:flex;
    flex-direction:column;
    gap:15px;
}

.menu a{

    text-decoration:none;
    color:white;
    font-size:19px;
    transition:.3s;
    width:max-content;
}

.menu a:hover{

    color:#ffd95f;
    transform:translateX(12px);
}

.menu a::before{

    content:"► ";
    color:#ffd95f;
}

.right{

    width:40%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.circle{

    width:500px;
    height:500px;
    border-radius:50%;
    border:2px solid rgba(255,215,90,.25);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    animation:rotate 35s linear infinite;
}

.circle::before{

    content:"";
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    border:1px solid rgba(255,215,90,.2);
}

.circle::after{

    content:"✦";
    position:absolute;
    font-size:170px;
    color:#e8c14b;
    text-shadow:0 0 40px gold;
}

@keyframes rotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

.footer{

    position:absolute;
    bottom:25px;
    width:100%;
    text-align:center;
    color:#888;
    letter-spacing:2px;
    font-size:14px;
}

</style>
</head>

<body>

<div class="stars"></div>
<div class="glow"></div>

<div class="container">

<div class="left">

<div class="logo">
THE GOLD<br>SEXTANT
</div>

<div class="subtitle">
"O destino pode ser reescrito?"
</div>

<div class="line"></div>

<div class="menu">

<a href="ler-historia.html">Ler História</a>
<a href="Personagens.html">Personagens</a>
<a href="#">Mundo</a>
<a href="#">Facções</a>
<a href="#">Sistema de Poderes</a>
<a href="#">Linha do Tempo</a>
<a href="#">Bestiário</a>
<a href="#">Extras</a>

</div>

</div>

<div class="right">

<div class="circle"></div>

</div>

</div>

<div class="footer">
THE GOLD SEXTANT • PILOTO • 2026
</div>

</body>
</html>
